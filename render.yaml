# Render Blueprint Specification (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: astittva-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker server:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_NAME
        value: astitva_db
      - key: MONGO_URL
        sync: false # Set your MongoDB Atlas URI: mongodb+srv://<user>:<password>@cluster0.xxxx.mongodb.net/?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 256-bit secret key
      - key: ADMIN_EMAIL
        value: admin@astitva.com
      - key: ADMIN_PASSWORD
        sync: false # Set your admin password, e.g., Astitva@2026
      - key: ADMIN_NAME
        value: Astitva Admin
      - key: CORS_ORIGINS
        value: "*" # Replace with your frontend domain once deployed (e.g. https://astittva.vercel.app)
      - key: FRONTEND_URL
        sync: false # Optional frontend URL
      - key: APP_NAME
        value: astitva-realestate
